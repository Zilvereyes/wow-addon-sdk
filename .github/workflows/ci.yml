name: SDK contract and architecture checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22'
            shell: bash
          - os: ubuntu-24.04
            node: '24'
            shell: bash
          - os: windows-latest
            node: '22'
            shell: pwsh
          - os: windows-latest
            node: '24'
            shell: pwsh
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm version
        run: npm install --global npm@10.9.2

      - name: Document toolchain
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build, tests, architecture and public exports
        run: npm run check:all
      - name: API Extractor (public API contract gate)
        run: npm run api:extractor
      - name: Verify package contents
        run: npm run check:packages
